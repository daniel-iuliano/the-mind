<!DOCTYPE html>
<html lang="es-AR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>The Mind | Trading Intel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              street: {
                dark: '#283137', // Dark Cyan-based Palette (Requested)
                light: '#f4f4f5', // Zinc 100
                cardDark: '#2A4250', // Slightly darker/desaturated for cards
                cardLight: '#ffffff',
                acid: '#fff35b', // Neon Green
                pink: '#ff0099', // Hot Pink
                purple: '#ad54ff', // Electric Purple
                cyan: '#00ffff',
              }
            },
            boxShadow: {
              'brutal': '4px 4px 0px 0px rgba(0,0,0,1)',
              'brutal-sm': '2px 2px 0px 0px rgba(0,0,0,1)',
              'brutal-white': '4px 4px 0px 0px rgba(255,255,255,1)',
              'glow': '0 0 15px rgba(204, 255, 0, 0.4)',
            },
            animation: {
              'heartbeat': 'heartbeat 2s ease-in-out infinite',
              'lightning': 'lightning 2s linear infinite',
              'float': 'float 3s ease-in-out infinite',
            },
            keyframes: {
              heartbeat: {
                '0%, 100%': { transform: 'scale(1)', opacity: '1' },
                '50%': { transform: 'scale(1.05)', opacity: '0.9' },
              },
              lightning: {
                '0%, 100%': { opacity: '0.2' },
                '10%, 90%': { opacity: '0.4' },
                '50%': { opacity: '1' },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-5px)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@400;700&display=swap');

      body {
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      
      /* Smooth transitions for theme switching */
      * {
        transition-property: background-color, border-color, color, fill, stroke;
        transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
        transition-duration: 150ms;
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #555;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #777;
      }
      
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "recharts": "https://esm.sh/recharts@^3.7.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.39.0",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-street-light text-street-dark dark:bg-street-dark dark:text-street-light selection:bg-street-acid selection:text-black font-sans antialiased">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
